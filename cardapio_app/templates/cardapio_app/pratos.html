{% extends "cardapio_app/base.html" %}
{% block conteudo %}<h2>Pratos</h2><a class="btn" href="{% url 'novo_prato' %}">Novo prato</a>
<table><tr><th>Nome</th><th>Preço</th><th>Disponível</th></tr>{% for p in pratos %}<tr><td>{{ p.nome }}</td><td>R$ {{ p.preco }}</td><td>{{ p.disponivel|yesno:"Sim,Não" }}</td></tr>{% endfor %}</table>{% endblock %}
