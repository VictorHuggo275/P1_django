{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Cardápio Digital{% endblock %}</title>
<link rel="stylesheet" href="{% static 'cardapio_app/style.css' %}">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{% url 'inicio' %}">🍽️ Cardápio Digital</a>
    <nav>
      <a href="{% url 'inicio' %}">Início</a>
      <a href="{% url 'mesas' %}">Mesas</a>
      <a href="{% url 'pratos' %}">Pratos</a>
      <a href="{% url 'combos' %}">Combos</a>
    </nav>
  </div>
</header>
<main>
{% if messages %}
<div class="messages">
{% for message in messages %}<div class="msg msg-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}
</div>
{% endif %}
{% block conteudo %}{% endblock %}
</main>
<footer>Projeto P1 · Django + SQLite</footer>
</body>
</html>
